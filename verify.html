<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>TruckConnect driver verification</title>
<style>
/* Same colours as the TruckConnect driver app. */
:root{--bg:#F5F5F5;--card:#FFFFFF;--border:#EBEBEB;--text:#0D0D0D;--muted:#6F6F6F;--green:#16a34a;--greenbg:#E6F6EC;--amber:#B45309;--amberbg:#FDF1DC;--red:#E03131;--redbg:#FCE8E8}
@media (prefers-color-scheme:dark){:root{--bg:#070F14;--card:#171D20;--border:#222629;--text:#FFFFFF;--muted:#9A9A9A;--greenbg:#12301F;--amber:#F2B64F;--amberbg:#3A2D12;--red:#FF8A80;--redbg:#3C1B19;--green:#4ADE80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-top:20px}
.brand{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:1.5px}
h1{font-size:22px;margin:8px 0 14px}
.badge{border-radius:18px;padding:18px;text-align:center;font-weight:800;font-size:22px;letter-spacing:.5px}
.badge small{display:block;font-size:13px;font-weight:600;margin-top:4px;opacity:.85;letter-spacing:0}
.ok{background:var(--greenbg);color:var(--green)}.warn{background:var(--amberbg);color:var(--amber)}.bad{background:var(--redbg);color:var(--red)}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:6px 16px;margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:15px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;margin-left:6px}
.m{color:var(--muted);font-size:13px;line-height:1.5;margin-top:14px}
.center{text-align:center;padding-top:60px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center m">Checking…</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeFirestore, getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyD0dRuRqbsJr0-Kv29xcpQGjW-1DiYPNLo",authDomain:"truck-connect-c0c67.firebaseapp.com",projectId:"truck-connect-c0c67",storageBucket:"truck-connect-c0c67.firebasestorage.app",messagingSenderId:"313065662016",appId:"1:313065662016:web:a43aecfce5d7db205d61a5"};
const app=initializeApp(cfg,'tc-verify');
let db;try{db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true,useFetchStreams:false});}catch(e){db=getFirestore(app);}
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=(new URLSearchParams(location.search).get('t')||'').trim();
const today=()=>{const d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);};
const fmt=s=>{if(!s)return '—';const d=new Date(String(s).slice(0,10)+'T12:00:00');return isNaN(d)?E(s):d.toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});};
function days(s){const a=new Date(String(s).slice(0,10)+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/86400000);}
function page(h){$('app').innerHTML='<div class="brand">TRUCKCONNECT</div><h1>Driver verification</h1>'+h;}
async function load(){
  if(token.length<20){page('<div class="badge bad">NOT VERIFIED<small>This code is not valid.</small></div>');return;}
  let d;
  try{const s=await getDoc(doc(db,'verifications',token));if(!s.exists()){page('<div class="badge bad">NOT VERIFIED<small>This code is not valid.</small></div>');return;}d=s.data();}
  catch(e){page('<div class="center m">No connection. Check your signal and scan again.</div>');return;}
  if(d.enabled===false){page('<div class="badge bad">NOT AVAILABLE<small>The driver has switched this code off.</small></div>');return;}
  const docs=Array.isArray(d.docs)?d.docs:[];let expired=0,soon=0;
  const rows=docs.map(x=>{const n=x.exp?days(x.exp):null;let tag='';
    if(n===null)tag='';else if(n<0){expired++;tag='<span class="tag bad">EXPIRED</span>';}else if(n<=30){soon++;tag='<span class="tag warn">'+(n<=7?'🚨 ':'⚠️ ')+n+' day'+(n===1?'':'s')+'</span>';}
    return '<div class="kv"><span>'+E(x.k)+'</span><span>'+fmt(x.exp)+tag+'</span></div>';}).join('');
  let cls,txt,sub='';
  if(!d.approved){cls='bad';txt='NOT VERIFIED';sub='TruckConnect has not approved these documents.';}
  else if(expired){cls='warn';txt='⚠️ EXPIRED';sub='One or more documents have expired.';}
  else{cls='ok';txt='✅ VERIFIED — TruckConnect';sub=d.approvedAt?'Approved '+fmt(String(d.approvedAt).slice(0,10)):'';}
  page('<div class="badge '+cls+'">'+txt+(sub?'<small>'+E(sub)+'</small>':'')+'</div>'+
   '<div class="card">'+
   '<div class="kv"><span>Full name</span><span>'+E(d.name||'—')+'</span></div>'+
   (d.company?'<div class="kv"><span>Company</span><span>'+E(d.company)+'</span></div>':'')+
   (d.idMasked?'<div class="kv"><span>ID number</span><span>'+E(d.idMasked)+'</span></div>':'')+
   '<div class="kv"><span>Licence code</span><span>'+E(d.licenceCode||'—')+'</span></div>'+
   (d.licenceNoMasked?'<div class="kv"><span>Licence number</span><span>'+E(d.licenceNoMasked)+'</span></div>':'')+
   '<div class="kv"><span>PrDP</span><span>'+E(d.prdp==='yes'?'Held':d.prdp==='no'?'Not held':'—')+'</span></div>'+
   '<div class="kv"><span>Vehicle registration</span><span>'+E(d.plate||'—')+'</span></div>'+
   '</div>'+(rows?'<div class="card">'+rows+'</div>':'')+
   '<div class="m">Checked just now against TruckConnect records. This page never shows a phone number, email or address. The status turns to EXPIRED by itself on the expiry date.</div>');
}
load();
</script>
</body>
</html>
