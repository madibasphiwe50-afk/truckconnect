<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677F2">
<meta name="robots" content="noindex">
<title>Follow your Truck Connect trip</title>
<style>
:root{--blue:#1677F2;--ink:#0B1730;--mut:#66758F;--bg:#fff;--card:#fff;--bd:#E3EAF6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#EAF1FB}
#map{position:absolute;inset:0}
.top{position:absolute;left:0;right:0;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px;background:linear-gradient(#fff,rgba(255,255,255,0))}
.logo{width:40px;height:40px;border-radius:10px;display:block;object-fit:cover}
.logo svg{width:24px;height:24px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.2px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--mut);letter-spacing:0}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bd);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(11,23,48,.08)}
.live i{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pl 1.6s infinite}
.live.off i{background:#9aa8bf;animation:none}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(11,23,48,.14)}
.grab{width:40px;height:4px;border-radius:2px;background:#CBD6E8;margin:0 auto 12px}
.eta{display:flex;align-items:baseline;gap:8px}
.eta b{font-size:30px;letter-spacing:-1px}
.eta span{font-size:14px;color:var(--mut)}
.status{font-size:14px;font-weight:600;margin-top:2px}
.row{display:flex;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)}
.cell{flex:1;min-width:0}
.cell small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.cell div{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate{display:inline-block;border:1.5px solid var(--ink);border-radius:6px;padding:1px 8px;font-weight:700;letter-spacing:.04em}
.msg{position:absolute;inset:0;z-index:9;display:none;place-items:center;text-align:center;padding:30px;background:#fff}
.msg.on{display:grid}
.msg h2{margin:14px 0 6px;font-size:20px}
.msg p{margin:0;color:var(--mut);line-height:1.5;max-width:320px}
.foot{font-size:11px;color:var(--mut);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <img class="logo" alt="Truck Connect" width="40" height="40" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAIAAABt+uBvAAAMoUlEQVR42u2ceWwcVx3Hv7/33szsetdHHDtnSWI7ddKDtJQkTZs0bVKKKKBWBcrRcomKQwJEkTgE4pJACKhaaMUlREtVVJVKoEJpVJVAQ9M2adQ0NAelcROnTeIQu3G8Pvaaee/9+GM2jnczzuHd2Eaap/nD8o7XO5/5Hd/f7/1madbXhxCv8ZeIEcSAYkAxoBhQDCgGFAOKAcUrBhQDigHFgGJAMaAYUAwoXjGgGFCtlqoNZpqO18YA81QDIgKAfHC+rrCaPxYCnqqWkaqSTqBhgY4WUoL4BK8aLjprdlT+qiDkfD54nF01RYCIoA0akvjVh5PrOpUgEIGmk38VA/7KY4WHtgWNSTJ20gEJwkiR735f8l0XK+ba206VS1ukPFrXqR7YEtDkWxABvsa8JvGeS5VlTLc1SmTrAVPlnZsgICGQK/A7L1ItabI87bIYA0rAN3huv0k4VM0tFBO+Rcbiuk4JYBpaUJi59vSY/W/ahIMpABRYNKdo/YVqeoqgkMhT/9EjRZY06UpaEPI+XzpPdLQK5ukIKITyfLdxZbU6aIKAihqrOxQRDE9H8yHCoQG7s8ckXbKTLxQtI+nQ9UukZYDPcIvOMolwtcK5LMErgS3dpm+YW1Kk7RQJxaRDgiDkmePl6RkxwzKkQK1UpisB4LGdWokaMJ8wIP72X4t33eK1pMV4hmMskg5m1NHpDYcIklDUGMjxSYvjEq8zlhqjNyA0ZAYKAT+0LXjylaA+MXEBffJCJjZhRoScz0mHUi7xODqAwcbit7cn33mRMhZSRBvXSJF/9Lfihj16qFAqVnjMm1A5jlFjHMUBBlHpBOZShZHJc9qjqWx3MCPlkmUMFca1Ykeid5gPDdjI8MKlcgm3/S7/1916ZooKmgNTrYBOeaQEGhNUq+yhqkoWgBLjfljLmNNA6zqjtZKxUAKPbA827NHzm2i4wJdfIBfMEGP95VzFvTH8XLfJ+yAJTIeGGZ9WPmR9rGoTbS3RWin8zT/2as+BNrjv1uRHVzqy6gbnE7v1xx/KY7p1FCO1kq95dbsiQDMUVZIVhHzAr/baQoA717mfWOVYrqomCEvClYtk2kM+gKTayAZ1/tSaq0rFGo2T+3f32P3H7Iw6+uAVyjKYUY0FhXb64humP8vVNIAmo2lPhIJGe4tYsVCG0SGyVnq+22SyvLhVXDRHCoo4bQLr769qbWvZtxPnyb8KAa9cKFMuGY74uGGttHmfBuNtFwhPIfK0c6u/BAKDF16vtr8xSS7GjPVLVGlfgSKCxX+HeFePVQ7WdCiMc9rZL2MhCHt7TVevTTqY1oAICAxmNdC1F0qKSvAhoG0HTE/Gzqqnq9rkqTrgXJsEYcXzh5eCrM8zHdLTGZAQGM7z1e1qXqOIbDaGv3h2vy4GuHSubGsRfAogIhw8bt8cYTGqksdXFgxog+e7zW+eCxqT1Vank2RBoT48FRADUsBYbH/DAFjVJgWV6u+TziLwxx3B5x4pgE4qRj6TR/u6ZuXF+QVkLOoTtL5TRqaAMMF39dm9fTaVwDUdlTpAEAi4f0uQC7i5jowtezncXIru0ntUZaUyGYAEIetj2Xxx8VzJAInoALSlW785zJ2zxdsXlAWg8NWjQ9zVZ9MeGVvWJyLCcIG1jWgeESGhKOHUvkFee0BFzWsXSyXKHKeiwti8z1iDZfPEjLqyTZEwl/3rsOkdthVij1BqYy5qJkEUVvChA0pCQfOOQ3bfmyblUm0ZqZoLaEfiHUvVeAJaEDJ53n7QCIlVbZVxKry0Fw6YCrEnBQbz/KErnAc+lhzvXw8V+NMP5zfs0Q21k9E1FopEKGq0zxQrF0qMk+ABvHzIHBqwTXV0zeLK0y   <div class="brand">Truck Connect<small>Live trip tracking</small></div>
  <div class="live" id="live"><i></i><span id="liveTxt">Live</span></div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="grab"></div>
  <div class="eta"><b id="etaBig">--</b><span id="etaSub"></span></div>
  <div class="status" id="status">Connecting…</div>
  <div class="row">
    <div class="cell"><small>Driver</small><div id="dName">—</div></div>
    <div class="cell"><small>Truck</small><div id="dTruck">—</div></div>
    <div class="cell"><small>Plate</small><div id="dPlate">—</div></div>
  </div>
  <div class="foot">This link only shows where the truck is. No personal details are shared.</div>
</div>
<div class="msg" id="msg"><div><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#1677F2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><h2 id="msgT"></h2><p id="msgP"></p></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

var MAPS_KEY = 'AIzaSyBQHtkvB94UPc-zfMsyAgFRk0crF3_QrcE';
var cfg = {apiKey:"AIzaSyD0dRuRqbsJr0-Kv29xcpQGjW-1DiYPNLo",authDomain:"truck-connect-c0c67.firebaseapp.com",projectId:"truck-connect-c0c67",storageBucket:"truck-connect-c0c67.firebasestorage.app",messagingSenderId:"313065662016",appId:"1:313065662016:web:a43aecfce5d7db205d61a5"};
var $ = function(i){return document.getElementById(i);};
var token = (new URLSearchParams(location.search)).get('t') || '';

function say(t, p){ $('msgT').textContent=t; $('msgP').textContent=p; $('msg').classList.add('on'); }

if (!/^[a-f0-9]{20,}$/i.test(token)) { say('Link not valid', 'This tracking link is incomplete. Ask the sender to share it again.'); }
else start();

function start(){
  var map=null, truck=null, pickPin=null, dropPin=null, line=null, glow=null, last=null, lastRoute={t:0,key:''}, data=null, haveMaps=false, queued=[];
  var db = initializeFirestore(initializeApp(cfg,'tc-track'), {experimentalAutoDetectLongPolling:true});

  // ---- Google Maps ----
  window._tcMapsReady = function(){
    haveMaps=true;
    map = new google.maps.Map($('map'),{center:{lat:-26.2,lng:28.04},zoom:12,disableDefaultUI:true,gestureHandling:'greedy',clickableIcons:false,
      styles:[{featureType:'poi',stylers:[{visibility:'off'}]},{featureType:'transit',stylers:[{visibility:'off'}]}]});
    queued.forEach(function(f){f();}); queued=[];
  };
  var s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+MAPS_KEY+'&callback=_tcMapsReady&loading=async';
  s.async=true; s.onerror=function(){ $('status').textContent='The map could not load. The truck details below still update.'; };
  document.head.appendChild(s);
  function whenMap(f){ if(haveMaps) f(); else queued.push(f); }

  // ---- the arrow that is the truck ----
  // A blue circle with a white arrow. The arrow turns to face the way the truck is heading.
  var ARROW='M0,-11 L8,9 L0,5 L-8,9 Z';
  function truckIcon(h){
    return { path: ARROW, scale: 1.15, rotation: (typeof h==='number'&&isFinite(h))?h:0, fillColor:'#1677F2', fillOpacity:1, strokeColor:'#fff', strokeWeight:2.5 };
  }
  function pinIcon(color){ return {path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:3}; }

  function bearing(a,b){
    var r=Math.PI/180, y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),
        x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);
    return (Math.atan2(y,x)/r+360)%360;
  }
  function glide(m,to){ // smooth move
    var from=m.getPosition(); if(!from){m.setPosition(to);return;}
    var a={lat:from.lat(),lng:from.lng()}, t0=performance.now(), dur=1200;
    (function step(t){ var k=Math.min(1,(t-t0)/dur); k=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      m.setPosition({lat:a.lat+(to.lat-a.lat)*k,lng:a.lng+(to.lng-a.lng)*k}); if(k<1)requestAnimationFrame(step); })(t0);
  }

  // ---- road route (not a straight line) ----
  function drawRoute(from,to,key){
    var now=Date.now();
    if(lastRoute.key===key && now-lastRoute.t<12000) return;
    lastRoute={t:now,key:key};
    fetch('https://router.project-osrm.org/route/v1/driving/'+from.lng+','+from.lat+';'+to.lng+','+to.lat+'?overview=full&geometries=geojson')
      .then(function(r){return r.json();})
      .then(function(j){
        if(!j||!j.routes||!j.routes.length) throw 0;
        var r0=j.routes[0], path=r0.geometry.coordinates.map(function(c){return {lat:c[1],lng:c[0]};});
        whenMap(function(){
          if(!line){
            glow=new google.maps.Polyline({map:map,path:path,strokeColor:'#1677F2',strokeOpacity:.25,strokeWeight:11,zIndex:1});
            line=new google.maps.Polyline({map:map,path:path,strokeColor:'#1677F2',strokeOpacity:1,strokeWeight:5,zIndex:2});
          } else { glow.setPath(path); line.setPath(path); }
          if(!drawRoute.fitted){ drawRoute.fitted=true; fit(); }
        });
        showEta(r0.duration/60, r0.distance/1000);
      })
      .catch(function(){ // road service unavailable: estimate and keep a thin straight guide so the page is never empty
        var km=hav(from,to)*1.35; showEta(km/35*60, km);
        whenMap(function(){ var p=[from,to];
          if(!line){ line=new google.maps.Polyline({map:map,path:p,strokeColor:'#1677F2',strokeOpacity:.6,strokeWeight:4,zIndex:2}); } else line.setPath(p); });
      });
  }
  function hav(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x));}
  function fmt(min){ min=Math.max(1,Math.round(min)); if(min<60) return min+' min'; var h=Math.floor(min/60), m=min%60; return h+' h'+(m?' '+m+' min':''); }
  function showEta(min,km){ $('etaBig').textContent=fmt(min); $('etaSub').textContent=(km<10?km.toFixed(1):Math.round(km))+' km away'; }
  function fit(){ if(!map) return; var b=new google.maps.LatLngBounds(), n=0;
    [last, targetOf(data)].forEach(function(p){ if(p){ b.extend(p); n++; } });
    if(n>1) map.fitBounds(b,{top:90,bottom:230,left:40,right:40}); else if(n===1) { map.setCenter(last||targetOf(data)); map.setZoom(14); } }
  function targetOf(d){ if(!d) return null; return d.phase==='dropoff' ? d.to : d.from; }

  // ---- live data ----
  var autoFollow=true;
  function apply(d){
    data=d;
    var ended=d.status==='ended', cancelled=d.status==='cancelled';
    if(ended||cancelled){
      say(cancelled?'This trip was cancelled':'This trip has ended', cancelled?'The truck is no longer on its way.':'The truck has arrived. Thank you for using Truck Connect.');
      $('live').classList.add('off'); $('liveTxt').textContent='Ended'; return;
    }
    $('sheet').hidden=false;
    $('dName').textContent=d.driver||'Your driver';
    $('dTruck').textContent=d.truck||'—';
    var pl=$('dPlate'); pl.textContent=''; if(d.plate){var sp=document.createElement('span');sp.className='plate';sp.textContent=d.plate;pl.appendChild(sp);} else pl.textContent='—';
    var inTransit=d.phase==='dropoff';
    $('status').textContent=inTransit?'On the way to the drop-off':'On the way to the pickup';
    var loc=d.loc&&typeof d.loc.lat==='number'?{lat:d.loc.lat,lng:d.loc.lng}:null, tgt=targetOf(d);
    whenMap(function(){
      if(d.from){ if(!pickPin) pickPin=new google.maps.Marker({map:map,position:d.from,icon:pinIcon('#22c55e'),zIndex:3,title:'Pickup'}); else pickPin.setPosition(d.from); }
      if(d.to){ if(!dropPin) dropPin=new google.maps.Marker({map:map,position:d.to,icon:pinIcon('#ef4444'),zIndex:3,title:'Drop-off'}); else dropPin.setPosition(d.to); }
      if(loc){
        var h=(typeof d.loc.heading==='number'&&isFinite(d.loc.heading))?d.loc.heading:(last?bearing(last,loc):null);
        if(!truck) truck=new google.maps.Marker({map:map,position:loc,icon:truckIcon(h),zIndex:9,title:'Truck'});
        else { glide(truck,loc); if(h!==null) truck.setIcon(truckIcon(h)); }
        if(autoFollow&&last&&!drawRoute.fitted===false) {}
      }
    });
    if(loc){ last=loc; $('liveTxt').textContent='Live'; $('live').classList.remove('off');
      if(tgt) drawRoute(loc,tgt,(d.phase||'')+':'+Math.round(loc.lat*300)+':'+Math.round(loc.lng*300));
    } else { $('liveTxt').textContent='Waiting for GPS'; $('live').classList.add('off'); $('etaBig').textContent='--'; $('etaSub').textContent='';
      if(tgt) whenMap(function(){ if(!pickPin&&!dropPin) fit(); }); }
    // reset the route when the trip moves from pickup to drop-off
    if(apply.phase && apply.phase!==d.phase){ lastRoute={t:0,key:''}; drawRoute.fitted=false; if(line){line.setMap(null);glow.setMap(null);line=null;glow=null;} }
    apply.phase=d.phase;
  }
  // map moves by the customer's hand stop auto-fitting
  whenMap(function(){ map.addListener('dragstart',function(){autoFollow=false;}); });

  onSnapshot(doc(db,'shares',token),function(snap){
    if(!snap.exists()){ say('Link not valid','This tracking link has expired or does not exist.'); return; }
    apply(snap.data());
  },function(){ say('Cannot load the trip','Check your internet connection and open the link again.'); });
}
</script>
</body>
</html>
